services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dpg_app
      POSTGRES_USER: dpg_dev
      POSTGRES_PASSWORD: dpg_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpg_dev -d dpg_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
